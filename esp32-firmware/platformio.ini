; QModem 助手 ESP32 固件
; 四个目标板任选其一烧录(见 README):
;  1. cyd_ili9341       — ESP32-2432S028R「CYD 小黄屏」(经典 ESP32 + 2.8寸 320x240)
;  2. wt32_sc01_plus    — WT32-SC01 Plus(ESP32-S3 + 3.5寸 480x320 并口电容触摸)
;  3. waveshare_s3_147  — 微雪 ESP32-S3-LCD-1.47(B 型)(ESP32-S3 + 1.47寸 172x320 竖条屏)
;  4. waveshare_s3_154  — 微雪 ESP32-S3-LCD-1.54 / Touch-1.54(ESP32-S3 + 1.54寸 240x240)
;  5. s3mini_spi        — ESP32-S3-MINI 裸板 + 外接 ST7789 SPI 屏(自接线,见 README)
;  6. s3mini_oled_096   — ESP32-S3-MINI 裸板 + 0.96寸 IIC OLED(SSD1306,只显示数值)

; 全局默认:所有 TFT 环境排除 OLED 渲染层(ui_oled.cpp);OLED 环境在下方单独覆盖
[env]
build_src_filter = +<*> -<ui_oled.cpp>

[env:cyd_ili9341]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bodmer/TFT_eSPI@^2.5.43
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    ; ---- 屏幕:ILI9341 240x320(CYD 引脚) ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D CORE_DEBUG_LEVEL=0

[env:wt32_sc01_plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bodmer/TFT_eSPI@^2.5.43
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    ; ---- WT32-SC01 Plus:ESP32-S3 + ST7796 3.5寸 480x320 8位并口 ----
    -D USER_SETUP_LOADED=1
    -D ESP32_S3=1
    -D ST7796_DRIVER=1
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_CS=-1
    -D TFT_DC=0
    -D TFT_RST=4
    -D TFT_WR=47
    -D TFT_RD=-1
    -D TFT_D0=9
    -D TFT_D1=46
    -D TFT_D2=3
    -D TFT_D3=8
    -D TFT_D4=18
    -D TFT_D5=17
    -D TFT_D6=16
    -D TFT_D7=15
    -D TFT_INVERSION_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D CORE_DEBUG_LEVEL=0

; ---- 微雪 ESP32-S3-LCD-1.47 / B 型:ST7789 SPI,172x320 竖条屏 ----
; 引脚来自微雪官方 wiki:MOSI=45 SCLK=40 CS=42 DC=41 RST=39 BL=48
[env:waveshare_s3_147]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bodmer/TFT_eSPI@^2.5.43
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=172
    -D TFT_HEIGHT=320
    -D TFT_MOSI=45
    -D TFT_SCLK=40
    -D TFT_CS=42
    -D TFT_DC=41
    -D TFT_RST=39
    -D TFT_BL=48
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D TFT_SPI_MODE=SPI_MODE3
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D CORE_DEBUG_LEVEL=0
    -D QM_ROTATION=0

; ---- 微雪 ESP32-S3-LCD-1.54 / Touch-LCD-1.54:ST7789 SPI,240x240 ----
; 引脚来自微雪官方资料(xiaozhi-esp32 适配):MOSI=39 SCLK=38 CS=21 DC=45 RST=40 BL=46
[env:waveshare_s3_154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bodmer/TFT_eSPI@^2.5.43
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=39
    -D TFT_SCLK=38
    -D TFT_CS=21
    -D TFT_DC=45
    -D TFT_RST=40
    -D TFT_BL=46
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D TFT_SPI_MODE=SPI_MODE3
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D CORE_DEBUG_LEVEL=0
    -D QM_ROTATION=0

; ---- ESP32-S3-MINI 裸板 + 外接 ST7789 SPI 屏(最通用配置) ----
; 兼容 MINI-1(4MB Flash/无PSRAM)与 N16R8(16MB+8MB PSRAM):统一用 qio_qspi + 4MB 分区
; 屏引脚为通用参考值,按实际接线改下方 TFT_* 即可(避开 S3 的 26-37 flash/PSRAM 保留脚)
; 默认屏:2.4寸 ST7789 240x320 竖屏;换 172x320 把 WIDTH/HEIGHT 对调即可
[env:s3mini_spi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bodmer/TFT_eSPI@^2.5.43
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/Adafruit GFX Library@^1.11.9

build_flags =
    -D USER_SETUP_LOADED=1
    -D ESP32_S3=1
    -D ST7789_DRIVER=1
    -D CGRAM_OFFSET=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    ; ---- 外接屏接线(通用 GPIO,可改) ----
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=13
    -D TFT_RST=14
    -D TFT_BL=9
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON=1
    -D TFT_SPI_MODE=SPI_MODE3
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D CORE_DEBUG_LEVEL=0
    -D QM_ROTATION=0

; ---- 0.96寸 I2C OLED(SSD1306 128x64):只显示四项数值 ----
; 用 build_src_filter 排除 TFT 渲染层(ui.cpp),改用 OLED 渲染层(ui_oled.cpp)
; 协议层(qmodem_client/analyzer/main)与 TFT 版完全共用
; 接线:SDA=IO8 SCL=IO9(可在下方 OLED_SDA/OLED_SCL 改)
[env:s3mini_oled_096]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
build_src_filter = +<*> -<ui.cpp>

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    olikraus/U8g2@^2.35.7

build_flags =
    -D OLED_SDA=8
    -D OLED_SCL=9
    -D CORE_DEBUG_LEVEL=0
